name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run check
      - run: npm test -- --maxWorkers=1
      - run: npm run test:coverage -- --maxWorkers=1
      - run: npm run build
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 -m py_compile deployment/hermes-plugin/__init__.py deployment/mithra-open-hand/__init__.py
      - run: bash -n deployment/install.sh
      - run: npm audit --audit-level=high
