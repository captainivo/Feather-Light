services:
  feather-light:
    build:
      context: .
      target: runtime
    image: feather-light:${FEATHER_LIGHT_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    ports:
      - "${FEATHER_LIGHT_BIND_ADDRESS:-127.0.0.1}:${FEATHER_LIGHT_PORT:-8765}:8765"
    environment:
      NODE_ENV: production
      FEATHER_LIGHT_CONFIG: /etc/feather-light/config.yaml
      FEATHER_LIGHT_DB: /var/lib/feather-light/feather-light.sqlite3
      HEALTH_CARD_DIR: /var/lib/river-slate/health-card
      AUTHORA_API_BASE_URL: ${AUTHORA_API_BASE_URL:-http://127.0.0.1:8421}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      SHARD_LANTERN_DB: /var/lib/shard-lantern/shard-lantern.sqlite3
      GRANITE_WING_URL: http://127.0.0.1:8765
    volumes:
      - feather-light-state:/var/lib/feather-light
      - river-slate-state:/var/lib/river-slate
      - shard-lantern-state:/var/lib/shard-lantern
      - type: bind
        source: ./deployment/config.container.yaml
        target: /etc/feather-light/config.yaml
        read_only: true
      - type: bind
        source: ${FEATHER_LIGHT_TOKEN_FILE:?Set FEATHER_LIGHT_TOKEN_FILE}
        target: /run/secrets/feather-light-api-token
        read_only: true
      - type: bind
        source: ${WESTPOLE_ARCHIVE_PATH:?Set WESTPOLE_ARCHIVE_PATH}
        target: /archive/westpole
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  feather-light-state:
  river-slate-state:
  shard-lantern-state:
