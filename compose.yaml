services:
  aauthora-tunnel:
    build:
      context: .
      target: runtime
    image: feather-light:${FEATHER_LIGHT_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    entrypoint: ["ssh"]
    command:
      - -NT
      - -i
      - /run/secrets/aauthora-tunnel-key
      - -o
      - IdentitiesOnly=yes
      - -o
      - ExitOnForwardFailure=yes
      - -o
      - ServerAliveInterval=30
      - -o
      - ServerAliveCountMax=3
      - -o
      - StrictHostKeyChecking=yes
      - -L
      - 0.0.0.0:18421:127.0.0.1:8421
      - mithra@192.168.1.65
    volumes:
      - type: bind
        source: ${AAUTHORA_TUNNEL_KEY_FILE:?Set AAUTHORA_TUNNEL_KEY_FILE}
        target: /run/secrets/aauthora-tunnel-key
        read_only: true
      - type: bind
        source: ${AAUTHORA_TUNNEL_KNOWN_HOSTS_FILE:?Set AAUTHORA_TUNNEL_KNOWN_HOSTS_FILE}
        target: /home/node/.ssh/known_hosts
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "const n=require('node:net').connect(18421,'127.0.0.1');n.setTimeout(3000);n.on('connect',()=>{n.end();process.exit(0)});n.on('error',()=>process.exit(1));n.on('timeout',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  feather-light:
    build:
      context: .
      target: runtime
    image: feather-light:${FEATHER_LIGHT_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    depends_on:
      aauthora-tunnel:
        condition: service_healthy
    ports:
      - "${FEATHER_LIGHT_BIND_ADDRESS:-127.0.0.1}:${FEATHER_LIGHT_PORT:-8765}:8765"
    environment:
      NODE_ENV: production
      FEATHER_LIGHT_CONFIG: /etc/feather-light/config.yaml
      FEATHER_LIGHT_DB: /var/lib/feather-light/feather-light.sqlite3
      HEALTH_CARD_DIR: /var/lib/river-slate/health-card
      AUTHORA_API_BASE_URL: ${AUTHORA_API_BASE_URL:-http://aauthora-tunnel:18421}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      SHARD_LANTERN_DB: /var/lib/shard-lantern/shard-lantern.sqlite3
      GRANITE_WING_URL: http://127.0.0.1:8765
    volumes:
      - feather-light-state:/var/lib/feather-light
      - river-slate-state:/var/lib/river-slate
      - shard-lantern-state:/var/lib/shard-lantern
      - type: bind
        source: ./deployment/config.container.yaml
        target: /etc/feather-light/config.yaml
        read_only: true
      - type: bind
        source: ${FEATHER_LIGHT_TOKEN_FILE:?Set FEATHER_LIGHT_TOKEN_FILE}
        target: /run/secrets/feather-light-api-token
        read_only: true
      - type: bind
        source: ${WESTPOLE_ARCHIVE_PATH:?Set WESTPOLE_ARCHIVE_PATH}
        target: /archive/westpole
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  archive-writer:
    build:
      context: .
      target: runtime
    image: feather-light:${FEATHER_LIGHT_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    working_dir: /app/granite-wing
    command: ["node", "/app/granite-wing/dist/src/cli.js", "archive-writer"]
    network_mode: "none"
    environment:
      NODE_ENV: production
      FEATHER_LIGHT_CONFIG: /etc/feather-light/config.yaml
      FEATHER_LIGHT_DB: /var/lib/feather-light/feather-light.sqlite3
      ARCHIVE_WRITER_ID: ${ARCHIVE_WRITER_ID:-feather-light-writer-1}
      ARCHIVE_WRITER_POLL_MS: ${ARCHIVE_WRITER_POLL_MS:-5000}
      ARCHIVE_WRITER_LEASE_SECONDS: ${ARCHIVE_WRITER_LEASE_SECONDS:-300}
    volumes:
      - feather-light-state:/var/lib/feather-light
      - type: bind
        source: ./deployment/config.container.yaml
        target: /etc/feather-light/config.yaml
        read_only: true
      - type: bind
        source: ${WESTPOLE_ARCHIVE_PATH:?Set WESTPOLE_ARCHIVE_PATH}
        target: /archive/westpole
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  feather-light-state:
  river-slate-state:
  shard-lantern-state:
